# Services de développement local pour la plateforme EPHT.
#
# Les identifiants PostgreSQL sont lus dans backend/.env afin de n'avoir
# qu'une seule source de vérité :
#
#   docker compose --env-file backend/.env up -d
#
# Le port n'est exposé que sur 127.0.0.1.
name: epht

services:
  postgres:
    image: postgres:17-alpine
    container_name: epht-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-epht}
      POSTGRES_USER: ${DB_USERNAME:-epht}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans backend/.env}
      # Base séparée utilisée par la suite de tests Laravel.
      EPHT_TEST_DATABASE: ${DB_TEST_DATABASE:-epht_test}
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - epht_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  epht_pgdata:
